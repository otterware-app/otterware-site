# Copies Otter Mail's changelog from otterware-app/otter-mail into changelog/mail/: the notes,
# their images, and `released`, the version Mail last released (notes written ahead of a
# release wait for it). A commit to main redeploys the site, so a note shows on
# otterware.app/mail/changelog/ within the hour of its release.
name: Mail changelog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: mail-changelog

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copy the notes
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/otterware-app/otter-mail.git "$RUNNER_TEMP/otter-mail"
          git -C "$RUNNER_TEMP/otter-mail" sparse-checkout set --no-cone /changelog/ /apps/desktop/package.json
          git -C "$RUNNER_TEMP/otter-mail" checkout
          rm -rf changelog/mail
          cp -R "$RUNNER_TEMP/otter-mail/changelog" changelog/mail
          node -p "require('$RUNNER_TEMP/otter-mail/apps/desktop/package.json').version" > changelog/mail/released
      - name: Commit
        run: |
          git add -A changelog/mail
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mail changelog, up to $(cat changelog/mail/released)"
          git push
